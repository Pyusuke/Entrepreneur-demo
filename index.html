<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>探究振り返りカードゲーム</title>
<style>
  :root{
    --c-seika:#3b7dd8;   /* 成果=青系 */
    --c-process:#2e9e6b; /* プロセス=緑系 */
    --c-skill:#e08a2e;   /* 能力=橙系 */
    --c-future:#8b5cf6;  /* 未来=紫（点線枠） */
    --c-blank:#9aa3af;   /* 余白=グレー枠 */
    --ink:#2b2b33;
    --ink-soft:#6b7280;
    --bg:#f4f2ec;
    --panel:#ffffff;
    --line:#e2ddd2;
    --accent:#d95d39;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    line-height:1.65; font-size:15px;
  }
  button{font-family:inherit;}
  /* フッター（ステップ表示）のぶん下に余白を確保 */
  #app{max-width:860px;margin:0 auto;padding:0 14px 150px;}

  /* ===== ヘッダー ===== */
  header.top{
    position:sticky;top:0;z-index:20;background:var(--bg);
    padding:10px 0 8px;border-bottom:1px solid var(--line);
    margin-bottom:14px;
  }
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:860px;margin:0 auto;padding:0 14px;}
  .app-name{font-size:13px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em;}
  .gear-btn{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:14px;cursor:pointer;color:var(--ink-soft);}

  /* ===== フッター固定のステップ表示 ===== */
  footer.stepbar{
    position:fixed;bottom:0;left:0;right:0;z-index:20;
    background:var(--bg);border-top:1px solid var(--line);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  .steps{display:flex;gap:4px;max-width:860px;margin:0 auto;}
  .steps .st{
    flex:1;text-align:center;font-size:10.5px;padding:5px 2px;border-radius:8px;
    background:#e9e5da;color:#8a8474;white-space:nowrap;overflow:hidden;
  }
  .steps .st.now{background:var(--accent);color:#fff;font-weight:700;}
  .steps .st.done{background:#cfc9ba;color:#6d675a;}

  /* ===== 汎用 ===== */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  h1{font-size:24px;line-height:1.4;}
  h2{font-size:18px;margin-bottom:8px;}
  h3{font-size:15px;margin-bottom:6px;}
  .soft{color:var(--ink-soft);font-size:13px;}
  .lead{font-size:14px;color:var(--ink-soft);}
  .btn{
    display:inline-block;border:none;border-radius:12px;cursor:pointer;
    padding:12px 22px;font-size:16px;font-weight:700;
    background:var(--accent);color:#fff;
  }
  .btn:disabled{background:#cfc9ba;cursor:not-allowed;}
  .btn.sub{background:#fff;color:var(--ink);border:1.5px solid var(--line);font-weight:600;}
  .btn.small{padding:7px 14px;font-size:13px;border-radius:9px;}
  .navrow{display:flex;justify-content:space-between;gap:10px;margin-top:6px;}
  textarea,input[type=text]{
    width:100%;border:1.5px solid var(--line);border-radius:10px;
    padding:10px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:64px;}
  textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  select{
    width:100%;border:1.5px solid var(--line);border-radius:10px;
    padding:10px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);
  }
  label.f{display:block;font-size:13px;font-weight:700;margin:12px 0 4px;}
  label.f .req{color:var(--accent);font-size:11px;margin-left:4px;}
  .hint-box{background:#fdf6ec;border:1px solid #f0e2c8;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0;}
  .talk-box{background:#eef4fb;border:1px solid #d5e3f5;border-radius:10px;padding:12px 14px;font-size:14px;margin:12px 0;}
  .talk-box b{color:var(--c-seika);}

  /* ===== カード ===== */
  .hand{
    display:flex;gap:10px;overflow-x:auto;padding:10px 4px 14px;
    -webkit-overflow-scrolling:touch;touch-action:pan-x;
  }
  .card{
    flex:0 0 auto;width:148px;min-height:196px;
    background:#fff;border:2px solid var(--line);border-radius:12px;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
    display:flex;flex-direction:column;overflow:hidden;position:relative;
    user-select:none;
  }
  /* バンドは右に余白を取り、✕ボタンと文字が重ならないようにする */
  .card .band{padding:5px 26px 5px 10px;font-size:11.5px;font-weight:700;color:#fff;letter-spacing:.05em;}
  .card .body{padding:9px 10px;flex:1;display:flex;flex-direction:column;gap:5px;}
  .card .ttl{font-size:15px;font-weight:700;line-height:1.45;word-break:break-word;}
  .card .ctx{font-size:11.5px;color:var(--ink-soft);line-height:1.5;word-break:break-word;}
  .card .cat{margin-top:auto;font-size:10.5px;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:5px;}
  .card.t-seika{border-color:var(--c-seika);} .card.t-seika .band{background:var(--c-seika);}
  .card.t-process{border-color:var(--c-process);} .card.t-process .band{background:var(--c-process);}
  .card.t-skill{border-color:var(--c-skill);} .card.t-skill .band{background:var(--c-skill);}
  .card.t-blank{border:2px dashed var(--c-blank);box-shadow:none;background:#fcfcfa;}
  .card.t-blank .band{background:transparent;color:var(--c-blank);border-bottom:1px dashed #d5d9df;}
  .card.t-blank .blank-msg{margin:auto;text-align:center;color:#b6bcc6;font-size:12px;line-height:1.8;}
  /* 未来カード：枠は紫の点線のまま、バンド色で種別（成果/プロセス/能力）を表現 */
  .card.t-future{border:2.5px dashed var(--c-future);background:#fbf9ff;}
  .card.t-future .band{background:transparent;color:var(--c-future);border-bottom:1.5px dashed #ddd0f8;}
  .card.t-future .band.b-seika{background:var(--c-seika);color:#fff;border-bottom:none;}
  .card.t-future .band.b-process{background:var(--c-process);color:#fff;border-bottom:none;}
  .card.t-future .band.b-skill{background:var(--c-skill);color:#fff;border-bottom:none;}
  /* 「まだ実物ではない」等のキャプションはバンドから本文下部へ移動（✕との重なり回避） */
  .card.t-future .fcap{margin-top:auto;font-size:10px;color:#9a8cc0;border-top:1px dashed #ddd0f8;padding-top:5px;}
  .card .del{
    position:absolute;top:3px;right:5px;background:none;border:none;cursor:pointer;
    font-size:15px;color:rgba(255,255,255,.85);line-height:1;padding:2px 4px;
  }
  .card.t-blank .del{color:#b7aed0;}

  /* 追加時のめくり */
  @keyframes deal{from{transform:rotateY(90deg) translateY(8px);opacity:0;}to{transform:rotateY(0) translateY(0);opacity:1;}}
  .card.deal{animation:deal .45s ease-out;transform-origin:left center;}

  /* 選択（タップで切る） */
  .card.pickable{cursor:pointer;transition:transform .15s;}
  .card.pickable:active{transform:scale(.97);}
  .card.picked{outline:3px solid var(--accent);outline-offset:2px;transform:translateY(-6px);}
  .card.disabled{opacity:.55;pointer-events:none;}

  /* 裏返し（3D） */
  .flip3d{flex:0 0 auto;width:148px;min-height:196px;perspective:900px;}
  .flip3d .inner{
    position:relative;width:100%;height:100%;min-height:196px;
    transform-style:preserve-3d;transition:transform .9s cubic-bezier(.6,-0.2,.3,1.2);
  }
  .flip3d.flipped .inner{transform:rotateY(180deg);}
  .flip3d .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
  .flip3d .face .card{width:100%;height:100%;}
  .flip3d .back{transform:rotateY(180deg);}
  /* 裏面：何を目指していたかがはっきり読めるデザイン */
  .card.future-back{border:2.5px dashed #c9b8ee;background:#f5f1fc;}
  .card.future-back .fb-band{
    background:#6d5a99;color:#fff;font-size:12px;font-weight:700;
    text-align:center;padding:6px;letter-spacing:.1em;
  }
  .card.future-back .fb-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:10px;text-align:center;}
  .card.future-back .fb-title{
    font-size:15px;font-weight:700;line-height:1.5;color:#4d4368;
    text-decoration:line-through;text-decoration-color:#b13b1c;text-decoration-thickness:2px;
    word-break:break-word;
  }
  .card.future-back .fb-type{font-size:10.5px;color:#8f84ad;}

  /* ドラッグ並べ替え */
  .card.dragging{opacity:.4;}
  .drag-hint{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:-6px;}

  /* ===== STEP1 ===== */
  details.catbox{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff;overflow:hidden;}
  details.catbox summary{
    cursor:pointer;padding:10px 14px;font-weight:700;font-size:14px;list-style:none;
    display:flex;align-items:center;gap:8px;
  }
  details.catbox summary::before{content:"▸";color:var(--accent);transition:transform .2s;}
  details.catbox[open] summary::before{transform:rotate(90deg);}
  details.catbox .exs{padding:0 14px 12px;font-size:13px;color:var(--ink-soft);}
  details.catbox .exs li{margin-left:18px;margin-bottom:2px;}
  .type-explain{font-size:13.5px;padding:0 14px 12px;}
  .type-explain li{list-style:none;margin-bottom:7px;padding-left:14px;position:relative;}
  .type-explain li::before{content:"";position:absolute;left:0;top:7px;width:8px;height:8px;border-radius:2px;}
  .type-explain li.e-seika::before{background:var(--c-seika);}
  .type-explain li.e-process::before{background:var(--c-process);}
  .type-explain li.e-skill::before{background:var(--c-skill);}
  .type-explain .tip{background:#f4f1ea;border-radius:8px;padding:7px 10px;font-size:12.5px;margin-top:4px;}
  .type-picker{display:flex;gap:8px;margin-top:4px;}
  .type-picker button{
    flex:1;padding:10px 4px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;
    border:2px solid var(--line);background:#fff;color:var(--ink-soft);
  }
  .type-picker button.on-seika{border-color:var(--c-seika);background:var(--c-seika);color:#fff;}
  .type-picker button.on-process{border-color:var(--c-process);background:var(--c-process);color:#fff;}
  .type-picker button.on-skill{border-color:var(--c-skill);background:var(--c-skill);color:#fff;}
  .counter{
    text-align:center;font-size:13.5px;font-weight:700;color:var(--ink-soft);
    background:#efece3;border-radius:9px;padding:7px;margin-top:10px;
  }
  .rule-check{font-size:13px;margin-top:10px;}
  .rule-check li{list-style:none;margin-bottom:3px;}
  .rule-check .ok{color:var(--c-process);font-weight:700;}
  .rule-check .ng{color:var(--accent);}

  /* ===== STEP3 メニュー ===== */
  .menu-item{
    display:flex;align-items:flex-start;gap:10px;padding:11px 12px;margin-bottom:7px;
    border:2px solid var(--line);border-radius:10px;cursor:pointer;background:#fff;font-size:14px;
  }
  .menu-item input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--accent);}
  .menu-item.on{border-color:var(--accent);background:#fdf3ef;font-weight:700;}
  .menu-item.off{opacity:.45;}

  /* ===== モーダル ===== */
  .modal-bg{position:fixed;inset:0;background:rgba(35,30,20,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;}
  .modal{background:#fff;border-radius:16px;max-width:480px;width:100%;max-height:82vh;overflow-y:auto;padding:20px;}
  .modal h3{margin-bottom:10px;}
  .vocab{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0;}
  .vocab span{background:#fdf1e3;border:1px solid #f0d9b8;border-radius:99px;padding:4px 12px;font-size:13px;}
  .pw-input{font-size:22px;text-align:center;letter-spacing:.3em;font-weight:700;}

  /* トースト */
  #toast{
    position:fixed;left:50%;bottom:70px;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13.5px;
    z-index:99;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;
  }
  #toast.show{opacity:1;}

  /* STEP4 演出 */
  .flip-msg{
    background:#2f2a3d;color:#f0eafc;border-radius:14px;padding:16px 18px;margin-bottom:14px;
    font-size:14.5px;line-height:1.9;
  }
  .flip-msg b{color:#cdb8f5;}

  /* ===== まとめ ===== */
  .sum-grid{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0;}
  .sum-grid .card,.sum-grid .flip3d{width:132px;min-height:176px;}
  .sum-grid .flip3d .inner{min-height:176px;}
  .ansline{font-size:13.5px;margin-bottom:6px;}
  .ansline b{color:var(--ink);}
  .tagchips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0;}
  .tagchips span{border-radius:99px;padding:2px 10px;font-size:12px;color:#fff;}
  .chip-seika{background:var(--c-seika);} .chip-process{background:var(--c-process);}
  .chip-skill{background:var(--c-skill);} .chip-blank{background:var(--c-blank);}
  .chip-future{background:var(--c-future);}

  @media (min-width:640px){
    body{font-size:16px;}
    .steps .st{font-size:12px;}
  }

  /* ===== 画像保存中（html2canvasは3D変形を再現できないため平面化する） ===== */
  .capturing .no-print{display:none !important;}
  .capturing .flip3d .inner{transform:none !important;transition:none !important;}
  .capturing .flip3d.flipped .front{visibility:hidden;}
  .capturing .flip3d.flipped .back{transform:none !important;}
  .capturing .flip3d:not(.flipped) .back{visibility:hidden;}

  /* ===== 印刷（まとめ画面 A4縦） ===== */
  @media print{
    body{background:#fff;font-size:11px;}
    header.top,footer.stepbar,.no-print,#toast{display:none !important;}
    #app{max-width:100%;padding:0;}
    .panel{border:1px solid #bbb;padding:8px 10px;margin-bottom:8px;break-inside:avoid;}
    .sum-grid .card,.sum-grid .flip3d{width:100px;min-height:130px;box-shadow:none;}
    .sum-grid .flip3d .inner{min-height:130px;}
    .card .ttl{font-size:11px;} .card .ctx{font-size:9px;} .card .band{font-size:9px;padding:3px 6px;}
    textarea{border:none;padding:0;min-height:0;}
  }
</style>
</head>
<body>
<div id="header-mount"></div>
<div id="app"></div>
<div id="footer-mount"></div>
<div id="toast"></div>
<div id="modal-mount"></div>

<!-- 画像保存用（ローカル同梱。CDN不使用でオフライン要件を維持） -->
<script src="./html2canvas.min.js"></script>
<script>
"use strict";
/* =========================================================
   探究振り返りカードゲーム v2
   - 5画面ステップ形式 / localStorage保存 / 通信なし
   - Service Worker（sw.js）でオフライン対応
   ========================================================= */

/* 画面遷移パスワード（先生の合図で進む用。変更はここだけ直せばOK）
   キー = いま居るステップ番号（そこから「次へ」進むときに要求） */
const PASSWORDS = {
  1: "1111",  // ①棚卸し → ②眺める
  2: "1111",   // ②眺める → ③お題1
  3: "1111",   // ③お題1 → ④お題2
  4: "1111",    // ④お題2 → まとめ
};
/* 設定画面のJSONエクスポート/インポート用（運営用） */
const ADMIN_PASSWORD = "1111";
/* エクスポートJSONに埋めるデータ形式バージョン */
const DATA_VERSION = 2;

const LS_KEY = "tankyu-card-game-v1";
const MAX_HAND = 5;          // 手作りカードの上限（余白で5枚に揃える）
const MAX_FUTURE = 2;        // お題1の未来カード上限（お題2の再発行は1枚）

const TYPES = {
  seika:   {label:"成果",     cls:"t-seika",   chip:"chip-seika"},
  process: {label:"プロセス", cls:"t-process", chip:"chip-process"},
  skill:   {label:"能力",     cls:"t-skill",   chip:"chip-skill"},
  blank:   {label:"余白",     cls:"t-blank",   chip:"chip-blank"},
  future:  {label:"未来",     cls:"t-future",  chip:"chip-future"},
};

const CATEGORIES = ["探究","部活","課外活動","学業","日常・生活"];

const CAT_EXAMPLES = {
  "探究":[
    "テーマを途中で変えた（プロセス）",
    "アンケートを作り直した（プロセス）",
    "発表をやり切った（成果）",
  ],
  "部活":[
    "3年間続けた（プロセス）",
    "自主練メニューを自分で組んだ（プロセス）",
    "ベンチ外でも支え続けた（プロセス）",
  ],
  "課外活動":[
    "生徒会・委員会で動いた（プロセス）",
    "地域活動・ボランティアに通い続けた（プロセス）",
    "習い事の発表・作品（成果）",
  ],
  "学業":[
    "質問リストを作って先生に聞きに行った（プロセス）",
    "毎日決まった時間に机に向かった（プロセス）",
    "苦手科目を平均点まで上げた（成果）",
  ],
  "日常・生活":[
    "弟妹の世話を担当してきた（プロセス）",
    "家事と勉強をやりくりした（プロセス）",
    "友達のもめごとの相談役（プロセス）",
  ],
};

const SKILL_VOCAB = [
  "チャレンジ精神","創造力","課題発見力","コミュニケーション力","論理的思考力",
  "プレゼン力","情報収集力","問題解決力","企画力","行動力",
  "決断力","継続する力","優先順位をつける力","人に聞きに行ける力","気持ちを切りかえる力",
];

const MENUS = [
  "① 部活・サークルに打ち込む",
  "② アルバイトで働く経験を積む",
  "③ 資格・専門の勉強を深める",
  "④ 留学・旅に出る",
  "⑤ 人に会いに行く（イベント・コミュニティ）",
  "⑥ 自分で何かを始める（発信・制作・小さな商売）",
  "⑦ じっくり探す（決めずに見て回る）",
];

const STEP_NAMES = ["スタート","① 棚卸し","② 眺める","③ お題1","④ お題2","まとめ"];

/* ---------------- 状態 ---------------- */
function defaultState(){
  return {
    nickname: "",
    step: 0,               // 0:start 1..4:STEP 5:まとめ
    cards: [],             // {id,type,title,context,category,sourceId,futureType,phase}
    step2Note: "",
    step3: { menus: [], why: "", effectiveIds: [] },
    step4: { playedIds: [], action: "", decl: {} },  // decl: {blankCardId: 宣言文}
    futureFlipped: false,  // STEP4の裏返し演出を実行済みか
    passed: [],            // パスワード通過済みのステップ番号
    summaryNote: "",
  };
}

let S = loadState();

/* 旧バージョンのデータ形式を現行に揃える（localStorage読込とJSONインポートで共用） */
function normalizeState(parsed){
  const st = Object.assign(defaultState(), parsed);
  if(!Array.isArray(st.passed)) st.passed = [];
  st.cards.forEach(c => { if(c.type === "future" && !c.phase) c.phase = 1; });
  return st;
}

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return normalizeState(JSON.parse(raw));
  }catch(e){ /* 壊れたデータは捨てる */ }
  return defaultState();
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

function uid(){
  return (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2));
}
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function byId(id){ return S.cards.find(c => c.id === id); }
function handOf(...types){ return S.cards.filter(c => types.includes(c.type)); }
function futuresPhase(p){ return S.cards.filter(c => c.type === "future" && (c.phase || 1) === p); }

let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

/* ---------------- パスワードモーダル（画面遷移と設定操作で共用） ---------------- */
let pwExpected = null, pwCb = null, pwWrongMsg = "";
function askPassword(expected, onOk, opts = {}){
  pwExpected = expected;
  pwCb = onOk;
  pwWrongMsg = opts.wrongMsg || "番号がちがいます";
  document.getElementById("modal-mount").innerHTML = `
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="max-width:340px;text-align:center;">
      <h3>${opts.title || "🔑 番号を入れてください"}</h3>
      <p class="soft">${opts.note || ""}</p>
      <input type="text" inputmode="numeric" autocomplete="off" id="pw-input" class="pw-input"
        onkeydown="if(event.key==='Enter')submitGate()">
      <div style="display:flex;gap:8px;justify-content:center;margin-top:14px;">
        <button class="btn small sub" onclick="closeModal()">やめる</button>
        <button class="btn small" onclick="submitGate()">すすむ</button>
      </div>
    </div>
  </div>`;
  document.getElementById("pw-input").focus();
}
function submitGate(){
  const v = document.getElementById("pw-input").value.trim();
  if(v === pwExpected){
    const cb = pwCb; pwCb = null;
    closeModal();
    if(cb) cb();
  }else{
    document.getElementById("pw-input").value = "";
    toast(pwWrongMsg);
  }
}

/* 画面遷移ゲート：一度通過したステップは再入力不要 */
function gate(fromStep, onOk){
  if(!PASSWORDS[fromStep] || S.passed.includes(fromStep)){ onOk(); return; }
  askPassword(PASSWORDS[fromStep], () => {
    S.passed.push(fromStep);
    save();
    onOk();
  }, {
    title: "🔑 先生の合図で進もう",
    note: "先生から伝えられた番号を入れてください。",
    wrongMsg: "先生の合図を待ってね",
  });
}

/* ---------------- カードHTML ---------------- */
function cardHTML(c, opts = {}){
  const t = TYPES[c.type];
  const extra = (opts.classes || "");
  const del = opts.deletable ? `<button class="del" data-del="${c.id}" aria-label="このカードを消す">✕</button>` : "";
  if(c.type === "blank"){
    return `<div class="card t-blank ${extra}" data-cid="${c.id}">
      <div class="band">余白</div>
      <div class="body"><div class="blank-msg">（白紙のまま持つ）<br>新しく獲りに行く枠</div></div>
      ${del}</div>`;
  }
  if(c.type === "future"){
    const ftLabel = c.futureType ? "未来の" + TYPES[c.futureType].label : "未来";
    const bandCls = c.futureType ? "b-" + c.futureType : "";
    const cap = (c.phase || 1) === 2 ? "目指し直し（お題2で再発行）" : "まだ実物ではない";
    return `<div class="card t-future ${extra}" data-cid="${c.id}">
      <div class="band ${bandCls}">${ftLabel}</div>
      <div class="body">
        <div class="ttl">${esc(c.title)}</div>
        <div class="ctx">${esc(c.context)}</div>
        <div class="fcap">${cap}</div>
      </div>${del}</div>`;
  }
  const ctx = c.type === "skill" ? `出典：${esc(c.context)}` : esc(c.context);
  return `<div class="card ${t.cls} ${extra}" data-cid="${c.id}">
    <div class="band">${t.label}</div>
    <div class="body">
      <div class="ttl">${esc(c.title)}</div>
      <div class="ctx">${ctx}</div>
      <div class="cat">${esc(c.category || "")}</div>
    </div>${del}</div>`;
}

/* 未来カード：3D裏返し対応版（裏面＝元の内容がはっきり読めるデザイン） */
function futureFlipHTML(c, flipped){
  const ftLabel = c.futureType ? "未来の" + TYPES[c.futureType].label : "未来カード";
  return `<div class="flip3d ${flipped ? "flipped" : ""}" data-flip="${c.id}">
    <div class="inner">
      <div class="face front">${cardHTML(c)}</div>
      <div class="face back">
        <div class="card future-back">
          <div class="fb-band">アテが外れた</div>
          <div class="fb-body">
            <div class="fb-title">${esc(c.title)}</div>
            <div class="fb-type">${ftLabel}（お題1で発行）</div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

/* 未来カード発行フォーム（STEP3とSTEP4で共用）
   p: id接頭辞（"fut" / "reissue"）, f: 下書きオブジェクト（form3 / form4） */
function futureFormHTML(p, f, titlePh, ctxPh){
  const on = t => f.ftype === t ? "on-" + t : "";
  return `
    <label class="f">未来カードの種別（将来の 成果 / プロセス / 能力 のどれ？）<span class="req">必須</span></label>
    <div class="type-picker" id="${p}-tp">

/* フォームの入力・種別ボタンを下書きオブジェクトに結びつける（render後に呼ぶ） */
function bindFutureForm(p, f){

/* ---------------- ヘッダー・フッター ---------------- */
function renderChrome(){
  const head = document.getElementById("header-mount");
  const foot = document.getElementById("footer-mount");
  if(S.step === 0){ head.innerHTML = ""; foot.innerHTML = ""; return; }
  head.innerHTML = `<header class="top">
    <div class="top-row">
      <span class="app-name">探究振り返りカードゲーム ${S.nickname ? "｜" + esc(S.nickname) : ""}</span>
      <button class="gear-btn" onclick="openSettings()">⚙ 設定</button>
    </div>
  </header>`;
  const steps = STEP_NAMES.slice(1).map((name, i) => {
    const n = i + 1;
    const cls = n === S.step ? "now" : (n < S.step ? "done" : "");
    return `<div class="st ${cls}">${name}</div>`;
  }).join("");
  foot.innerHTML = `<footer class="stepbar"><div class="steps">${steps}</div></footer>`;
}

/* ---------------- 画面遷移 ---------------- */
function go(step){
  S.step = step;
  save();
  window.scrollTo(0, 0);
  render();
}

function render(){
  renderChrome();
  const app = document.getElementById("app");
  switch(S.step){
    case 0: app.innerHTML = viewStart(); break;
    case 1: app.innerHTML = viewStep1(); afterStep1(); break;
    case 2: app.innerHTML = viewStep2(); afterStep2(); break;
    case 3: app.innerHTML = viewStep3(); afterStep3(); break;
    case 4: app.innerHTML = viewStep4(); afterStep4(); break;
    case 5: app.innerHTML = viewSummary(); break;
  }
}

function afterStep1(){

function addCard(){
  const made = handOf("seika","process","skill");
  if(made.length >= MAX_HAND){ toast("手札は5枚までです"); return; }

  const title = form1.title.trim();
  const cat = form1.cat;
  if(!title){ toast("ひと言タイトルを入れてください"); return; }
  if(!cat){ toast("出身カテゴリーを選んでください"); return; }

  let context = "", sourceId = null;
  if(form1.type === "skill"){
    sourceId = form1.sourceId;
    if(!sourceId || !byId(sourceId)){ toast("能力カードには出典が必要です。どのカードから得た力か選ぼう"); return; }
    context = byId(sourceId).title;   // 出典カード名を文脈に持つ
  }else{
    context = form1.context.trim();
    if(!context){ toast("ひとことメモを入れてください"); return; }
  }

  S.cards.push({ id: uid(), type: form1.type, title, context, category: cat, sourceId });
  save();
  form1.title = ""; form1.context = ""; form1.sourceId = "";   // 種別とカテゴリーは残す
  render();
  // 追加されたカードにめくりアニメーション
  const hand = document.getElementById("hand1");
  const last = hand && hand.querySelector(".card:last-of-type");
  if(last){ last.classList.add("deal"); last.scrollIntoView({behavior:"smooth", inline:"end", block:"nearest"}); }
}

function deleteCard(id){
  const c = byId(id);
  if(!c) return;
  const dependent = S.cards.find(x => x.type === "skill" && x.sourceId === id);
  if(dependent){
    toast(`このカードは能力カード「${dependent.title}」の出典です。先にそちらを消してください`);
    return;
  }
  if(!confirm("このカードを消します。消すと元に戻せません。よろしいですか？")) return;
  S.cards = S.cards.filter(x => x.id !== id);
  save();
  render();
}

function finishStep1(){
  const made = handOf("seika","process","skill");
  const cnt = t => made.filter(c => c.type === t).length;
  if(cnt("seika") < 1 || cnt("process") < 1 || cnt("skill") < 1){
    toast("成果・プロセス・能力を、それぞれ1枚以上作ってください");
    return;
  }
  gate(1, () => {
    // 余白カードは差分だけ増減する（IDを維持し、STEP4の獲得宣言などの参照を守る）
    const blanks = S.cards.filter(c => c.type === "blank");
    const need = MAX_HAND - handOf("seika","process","skill").length;
    if(blanks.length > need){
      const removeIds = blanks.slice(need).map(c => c.id);
      S.cards = S.cards.filter(c => !removeIds.includes(c.id));
      S.step4.playedIds = S.step4.playedIds.filter(id => !removeIds.includes(id));
      removeIds.forEach(id => delete S.step4.decl[id]);
    }else{
      for(let i = blanks.length; i < need; i++){
        S.cards.push({ id: uid(), type: "blank", title: "", context: "", category: "", sourceId: null });
      }
    }
    go(2);
  });
}

/* --- ドラッグ並べ替え（マウス・タッチ共通：Pointer Events）
      iPad Safari / Chromebook（タッチ+マウス両方）を想定。
      長押し(220ms)で発動し、横スクロールと共存させる。 --- */
function enableDragSort(container){
  if(!container) return;
  let dragEl = null;

  container.querySelectorAll(".card").forEach(card => {
    card.style.touchAction = "pan-x";
    let holdTimer = null, started = false, startX = 0, startY = 0;

    card.addEventListener("pointerdown", e => {
      startX = e.clientX; startY = e.clientY; started = false;
      holdTimer = setTimeout(() => {   // 長押しでドラッグ開始（横スクロールと共存）
        started = true;
        dragEl = card;
        card.classList.add("dragging");
        // setPointerCapture はブラウザや状況（pointerが既にinactive等）により
        // 例外を投げることがある。失敗してもドラッグ自体は継続できるので握りつぶす。
        try{ card.setPointerCapture(e.pointerId); }catch(err){ /* no-op */ }
      }, 220);
    });

    card.addEventListener("pointermove", e => {
      if(!started){
        if(Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8) clearTimeout(holdTimer);
        return;
      }
      e.preventDefault();
      const siblings = [...container.querySelectorAll(".card")].filter(c => c !== dragEl);
      for(const sib of siblings){
        const r = sib.getBoundingClientRect();
        if(e.clientX > r.left && e.clientX < r.right){
          const before = e.clientX < r.left + r.width / 2;
          container.insertBefore(dragEl, before ? sib : sib.nextSibling);
          break;
        }
      }
    });

    const end = () => {
      clearTimeout(holdTimer);
      if(started && dragEl){
        dragEl.classList.remove("dragging");
        // DOMの並び順を状態に反映
        const order = [...container.querySelectorAll(".card")].map(el => el.dataset.cid);
        S.cards.sort((a, b) => {
          const ia = order.indexOf(a.id), ib = order.indexOf(b.id);
          if(ia === -1 || ib === -1) return 0;
          return ia - ib;
        });
        save();
      }
      dragEl = null; started = false;
    };
    card.addEventListener("pointerup", end);
    card.addEventListener("pointercancel", end);
  });
}

/* まとめ画面をPNG画像として保存（html2canvas利用・ローカル同梱） */
function pad2(n){ return String(n).padStart(2, "0"); }
function dateStamp(){
  const d = new Date();
  return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}`;
}
/* ニックネームをファイル名に使える形にする（パス区切り等の危険文字だけ除去） */
function fileSafe(name){
  const s = String(name || "").replace(/[\\/:*?"<>|]/g, "_").trim();
  return s || "noname";
}
/* Blobを指定ファイル名でダウンロードする
   注：download属性のファイル名が効くのはHTTP(S)配信時。file://で直接開いた場合は
   ブラウザ既定の名前になることがある（本番はVercel等のHTTP配信を想定） */
function downloadBlob(blob, filename){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
async function saveImage(){
  try{
    if(typeof html2canvas !== "function") throw new Error("html2canvas not loaded");
    document.body.classList.add("capturing");   // 3D裏返しを平面化し、ボタン類を隠す
    const canvas = await html2canvas(document.getElementById("app"), {
      backgroundColor: "#f4f2ec",
      scale: 2,
    });
    document.body.classList.remove("capturing");
    const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
    if(!blob) throw new Error("toBlob failed");
    downloadBlob(blob, `たんきゅうカード_${fileSafe(S.nickname)}_${dateStamp()}.png`);
    toast("画像を保存しました");
  }catch(e){
    document.body.classList.remove("capturing");
    toast("うまく保存できないときは、スクリーンショットを撮ってね");
  }
}

          <button class="btn small sub" onclick="exportJSON()">📤 データをJSONで書き出す（エクスポート）</button>
          <button class="btn small sub" onclick="importJSON()">📥 JSONを読み込む（インポート）</button>
        </div>
        <p class="soft" style="margin-top:8px;font-size:11.5px;">授業前のバックアップ・テストプレイのデータ回収用。実行には運営用の番号が必要です。</p>
      </div>
      <details>
        <summary style="cursor:pointer;font-size:13px;color:var(--ink-soft);">動作確認用テストデータ（4ペルソナ）</summary>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">
          <button class="btn small sub" onclick="loadPersona('mina')">ミナ（探究充実型・手札5枚）</button>
          <button class="btn small sub" onclick="loadPersona('kenta')">ケンタ（部活一筋型・手札3枚＋余白2）</button>
          <button class="btn small sub" onclick="loadPersona('aoi')">アオイ（日常型・手札3枚＋余白2）</button>
          <button class="btn small sub" onclick="loadPersona('yu')">ユウ（学業型・手札4枚＋余白1）</button>
        </div>
        <p class="soft" style="margin-top:8px;">読み込むと現在のデータは消え、STEP1から通しで確認できます。</p>
      </details>
      <div style="text-align:center;margin-top:16px;"><button class="btn small sub" onclick="closeModal()">とじる</button></div>
    </div>
  </div>`;
}

function resetAll(){
  if(!confirm("この端末のデータをすべて消します。消したデータは復元できません。よろしいですか？")) return;
  localStorage.removeItem(LS_KEY);
  S = defaultState();
  resetForms();
  closeModal();
  render();
  toast("すべてのデータを消しました");
}
function resetForms(){
  form1 = { type:"seika", title:"", context:"", cat:"", sourceId:"", explainOpen:true };
  form3 = { ftype:"", title:"", ctx:"" };
  form4 = { ftype:"", title:"", ctx:"" };
}

/* ---------------- JSONエクスポート／インポート（運営用・要パスワード） ---------------- */
function exportJSON(){
  askPassword(ADMIN_PASSWORD, () => {
    const d = new Date();
    const stamp = `${dateStamp()}-${pad2(d.getHours())}${pad2(d.getMinutes())}`;
    const payload = {
      app: "tankyu-card-game",
      dataVersion: DATA_VERSION,
      exportedAt: d.toISOString(),
      state: S,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
    downloadBlob(blob, `tankyu-save_${fileSafe(S.nickname)}_${stamp}.json`);
    toast("保存データを書き出しました");
  }, {title: "🔑 運営用の番号", note: "エクスポートには運営用の番号が必要です。"});
}

function validateSave(obj){
  return !!(obj
    && obj.app === "tankyu-card-game"
    && typeof obj.dataVersion === "number" && obj.dataVersion <= DATA_VERSION
    && obj.state && typeof obj.state === "object"
    && typeof obj.state.nickname === "string"
    && typeof obj.state.step === "number"
    && Array.isArray(obj.state.cards)
    && obj.state.step3 && typeof obj.state.step3 === "object"
    && obj.state.step4 && typeof obj.state.step4 === "object");
}

function importJSON(){
  askPassword(ADMIN_PASSWORD, () => {
    const inp = document.createElement("input");
    inp.type = "file";
    inp.accept = "application/json,.json";
    inp.onchange = () => {
      const file = inp.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        let obj = null;
        try{ obj = JSON.parse(reader.result); }catch(e){ /* 下のバリデーションで弾く */ }
        if(!validateSave(obj)){
          toast("このファイルは読み込めません（形式がちがいます）");
          return;   // 現在のデータは変更しない
        }
        if(!confirm("現在のデータは読み込んだ内容で上書きされ、元に戻せません。よろしいですか？")) return;
        S = normalizeState(obj.state);
        save();
        resetForms();
        render();
        toast("データを読み込みました");
      };
      reader.readAsText(file);
    };
    inp.click();
  }, {title: "🔑 運営用の番号", note: "インポートには運営用の番号が必要です。"});
}

/* ---------------- テスト用ペルソナ ---------------- */
function loadPersona(key){
  const P = buildPersona(key);
  if(!P) return;
  if(!confirm("現在のデータは消え、テストデータに入れ替わります。元のデータは復元できません。よろしいですか？")) return;
  localStorage.removeItem(LS_KEY);
  S = P;
  save();
  resetForms();
  closeModal();
  render();
  toast(`テストデータ「${P.nickname}」を読み込みました`);
}

function buildPersona(key){
  const mk = (type, title, context, category, sourceId) =>
    ({ id: uid(), type, title, context, category: category || "", sourceId: sourceId || null });
  const mkFuture = (title, context, futureType, phase) =>
    ({ id: uid(), type: "future", title, context, category: "", sourceId: null, futureType, phase });
  const mkBlank = () =>
    ({ id: uid(), type: "blank", title: "", context: "", category: "", sourceId: null });

  if(key === "mina"){
    const c1 = mk("seika","商店街調査の発表をやり切った","商店主15人の声を全校に発表","探究");
    const c2 = mk("process","アンケートの配り方を3回変えた","回収率が低くて困っていたとき","探究");
    const c3 = mk("process","商店主にインタビューを申し込んだ","知らない大人に自分から連絡した","探究");
    const c4 = mk("skill","初対面の大人に話を聞ける力", c3.title, "探究", c3.id);
    const c5 = mk("skill","データを集め直す粘り強さ", c2.title, "探究", c2.id);
    const f1 = mkFuture("働く現場で大人と協働する力","バイト先で年上の人とチームで動く","skill",1);
    const f2 = mkFuture("知り合いを頼って別の現場を探す","商店街のつながりを使う","process",2);
    return Object.assign(defaultState(), {
      nickname:"ミナ", step:1,
      cards:[c1,c2,c3,c4,c5,f1,f2],
      step3:{ menus:[1,5], why:"働く経験と、自分で始める経験は両方ほしいから。", effectiveIds:[c4.id,c5.id] },
      step4:{ playedIds:[c3.id,c5.id], action:"バイトが合わなくても、人に聞きに行く力は消えない。別の場所を探す。", decl:{} },
    });
  }
  if(key === "kenta"){
    const c1 = mk("seika","野球部で3年間続けた記録","レギュラーでなくても最後まで","部活");
    const c2 = mk("process","自主練メニューを組んで毎朝続けた","結果が出ない時期も朝練を欠かさず","部活");
    const c3 = mk("skill","結果が出なくても継続する力", c2.title, "部活", c2.id);
    const b1 = mkBlank(), b2 = mkBlank();
    const f1 = mkFuture("野球以外の世界を3つのぞく","サークル・バイト・イベントを見て回る","process",1);
    const f2 = mkFuture("野球以外の場に月1で通い続ける","小さく顔を出すのを続ける","process",2);
    return Object.assign(defaultState(), {
      nickname:"ケンタ", step:1,
      cards:[c1,c2,c3,b1,b2,f1,f2],
      step3:{ menus:[0,6], why:"部活は続けたい。でも野球しか知らないから、余白は⑦と一緒に切って世界を広げる。", effectiveIds:[c3.id] },
      step4:{ playedIds:[c3.id,b1.id], action:"続ける力はある。月1のペースなら、飽きても続けられる。",
              decl:{ [b1.id]:"私はこの状況で、野球以外の仲間を獲りに行きます" } },
    });
  }
  if(key === "aoi"){
    const c1 = mk("seika","弟妹の朝の支度を3年間担当","家族の朝を毎日まわしてきた","日常・生活");
    const c2 = mk("process","家事と勉強の時間をやりくりし続けた","部活はできなかったが両立した","日常・生活");
    const c3 = mk("skill","限られた時間で優先順位をつける力", c2.title, "日常・生活", c2.id);
    const b1 = mkBlank(), b2 = mkBlank();
    const f1 = mkFuture("自分で稼いだお金で決める経験","バイト代の使いみちを自分で決める","seika",1);
    const f2 = mkFuture("自分に合うバイトを2〜3か所試す","短期で試して見極める","process",2);
    return Object.assign(defaultState(), {
      nickname:"アオイ", step:1,
      cards:[c1,c2,c3,b1,b2,f1,f2],
      step3:{ menus:[1,4], why:"家の外の世界で、自分の時間とお金を自分で動かしてみたいから。", effectiveIds:[c3.id] },
      step4:{ playedIds:[c3.id,b1.id], action:"時間のやりくりは得意。短期で試して、合う場所を選ぶ。",
              decl:{ [b1.id]:"私はこの状況で、自分に合う職場を獲りに行きます" } },
    });
  }
  if(key === "yu"){
    const c1 = mk("seika","苦手だった数学を平均点まで上げた","模試の点数で証明できる","学業");
    const c2 = mk("process","質問リストを作って先生に聞きに行った","わからない所を言葉にしてから質問","学業");
    const c3 = mk("process","毎日決まった時間に机に向かった","気分に左右されない仕組みを作った","学業");
    const c4 = mk("skill","わからないことを言語化して聞く力", c2.title, "学業", c2.id);
    const b1 = mkBlank();
    const f1 = mkFuture("これだと思える専門分野","1年目は⑦で見て回り、その後③で深める","seika",1);
    const f2 = mkFuture("入門講座で向き不向きを確かめる","1つ受けてから決める","process",2);
    return Object.assign(defaultState(), {
      nickname:"ユウ", step:1,
      cards:[c1,c2,c3,c4,b1,f1,f2],
      step3:{ menus:[2,6], why:"1年目は⑦でじっくり探し、決まったら③で深める。時間差の計画。", effectiveIds:[c4.id] },
      step4:{ playedIds:[c4.id,b1.id], action:"質問する力で入門講座の先生に聞きまくって、早めに見極める。",
              decl:{ [b1.id]:"私はこの状況で、別の分野の入門知識を獲りに行きます" } },
    });
  }
  return null;
}

/* ---------------- 起動 ---------------- */
render();
